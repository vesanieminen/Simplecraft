name: Test

# The e2e suite is this project's safety net (no unit tests yet): a real
# Chromium drives the game against the dev server on :3100, the same way
# `npm test` does locally. Runs on every pull request and every push to main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      # fresh world data: the suite shares one save between tests and its
      # fuse/persistence checks assume a clean slate (same as the local loop)
      - run: rm -rf /tmp/opencode/lbw-test-world
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
